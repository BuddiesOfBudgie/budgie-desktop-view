name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  fedora:
    name: Fedora Rawhide
    runs-on: ubuntu-latest
    container: "registry.fedoraproject.org/fedora:rawhide"
    steps:
      - name: Install prerequisites
        run: |
          dnf install --assumeyes \
            'pkgconfig(gdk-pixbuf-2.0)' \
            'pkgconfig(gtk+-3.0)' \
            'pkgconfig(gtk-layer-shell-0)' \
            'pkgconfig(libxfce4windowing-0)' \
            'pkgconfig(vapigen)' \
            gcc \
            gettext \
            intltool \
            meson \
            vala
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Budgie Desktop View
        run: |
          meson setup build
          meson compile -C build
      - name: Run unit tests
        run: meson test -C build --print-errorlogs

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: "docker.io/library/archlinux:latest"
    steps:
      - name: Install prerequisites
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            gtk-layer-shell \
            gtk3 \
            intltool \
            libxfce4windowing \
            meson \
            vala
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Budgie Desktop View
        run: |
          meson setup build
          meson compile -C build
      - name: Run unit tests
        run: meson test -C build --print-errorlogs

  alpine:
    name: Alpine Edge
    runs-on: ubuntu-latest
    container: "docker.io/library/alpine:edge"
    steps:
      - name: Install prerequisites
        run: |
          apk add --no-cache \
            build-base \
            gettext-dev \
            gtk+3.0-dev \
            gtk-layer-shell-dev \
            intltool \
            libxfce4windowing-dev \
            meson \
            vala
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Budgie Desktop View
        run: |
          meson setup build
          meson compile -C build
      - name: Run unit tests
        run: meson test -C build --print-errorlogs

  ubuntu:
    name: Ubuntu 26.04
    runs-on: ubuntu-latest
    container: "docker.io/library/ubuntu:26.04"
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -q
          apt-get install -q -y \
            build-essential \
            gettext \
            intltool \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libxfce4windowing-0-dev \
            meson \
            pkg-config \
            valac
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Budgie Desktop View
        run: |
          meson setup build
          meson compile -C build
      - name: Run unit tests
        run: meson test -C build --print-errorlogs

  extra-architectures:
    name: Ubuntu 26.04 (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64
          - arch: riscv64
            platform: linux/riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and test under QEMU
        uses: uraimo/run-on-arch-action@v3
        with:
          # The action has no 26.04 image of its own, so pick the platform's ubuntu:26.04 directly
          arch: none
          distro: none
          base_image: --platform=${{ matrix.platform }} ubuntu:26.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -q -y \
              build-essential \
              gettext \
              intltool \
              libgtk-3-dev \
              libgtk-layer-shell-dev \
              libxfce4windowing-0-dev \
              meson \
              pkg-config \
              valac
          run: |
            meson setup build
            meson compile -C build
            meson test -C build --print-errorlogs
